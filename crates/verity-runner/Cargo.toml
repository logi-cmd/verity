[package]
name = "verity-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Isolated execution and locally signed verification receipts for Verity"

[dependencies]
verity-core = { path = "../verity-core" }
verity-adapters = { path = "../verity-adapters" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs.workspace = true
tempfile = "3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
