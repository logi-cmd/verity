[package]
name = "verity-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Open-source command-line interface for Verity"

[[bin]]
name = "verity"
path = "src/main.rs"

[dependencies]
verity-core = { path = "../verity-core" }
verity-adapters = { path = "../verity-adapters" }
verity-runner = { path = "../verity-runner" }
serde_json.workspace = true
serde.workspace = true
clap = { version = "4", features = ["derive"] }
uuid.workspace = true
