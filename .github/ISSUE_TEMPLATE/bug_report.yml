name: Bug report
description: Report a reproducible Verity defect without private repository data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach raw receipts, private paths, logs, source, tokens, or signing material.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Verity version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows x64, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal public reproduction
      description: Link a public fixture or describe a minimal reproduction with private values removed.
    validations:
      required: true
