[workspace]
members = [
  "crates/verity-core",
  "crates/verity-adapters",
  "crates/verity-runner",
  "crates/verity-cli",
  "desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.2"
edition = "2021"
license = "MPL-2.0"
authors = ["Verity contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
json5 = "1.3"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
ignore = "0.4"
globset = "0.4"
